<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#100e0c"/>
  <title>404 · Page introuvable</title>
  <!-- Servie à n'importe quelle profondeur : tout est autonome (style en ligne, favicon data URI, lien d'accueil calculé) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23100e0c'/%3E%3Cpath d='M44 20.5A17 17 0 1 0 44 43.5' fill='none' stroke='%23ff6b3d' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='48.5' cy='46' r='3.5' fill='%23ff6b3d'/%3E%3C/svg%3E"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #100e0c; --surface: #1a1714; --border: #3b352f; --border-strong: #5f574e;
      --accent: #ff6b3d; --ink: #120f0c; --text: #f4ead5; --muted: #9d9488;
    }
    html { color-scheme: dark; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; text-align: center;
      padding: 2rem 1.5rem;
      background: var(--bg); color: var(--text);
      font: 400 1rem/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* Courbes de niveau, comme dans le hero du site */
    body::before {
      content: ''; position: fixed; inset: -20%;
      background: repeating-radial-gradient(circle at 70% 40%, transparent 0 46px, #3b352f66 46px 47px);
      mask-image: radial-gradient(ellipse 60% 60% at 70% 40%, #000 15%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 70% 40%, #000 15%, transparent 75%);
      pointer-events: none;
    }
    main { position: relative; max-width: 34rem; }
    .code {
      font: italic 400 clamp(7rem, 28vw, 13rem)/.85 Georgia, 'Times New Roman', serif;
      letter-spacing: -.04em;
      color: transparent; -webkit-text-stroke: 1px var(--border-strong);
      margin-bottom: 1.5rem; user-select: none;
    }
    .code span { color: var(--accent); -webkit-text-stroke: 0; }
    h1 {
      font-weight: 800; font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.05; letter-spacing: -.04em; margin-bottom: .75rem;
    }
    p { color: var(--muted); margin-bottom: 2rem; }
    a {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .75rem 1.5rem;
      background: var(--accent); color: var(--ink);
      border-radius: 999px; text-decoration: none;
      font: 500 .75rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .06em; text-transform: uppercase;
      transition: transform .3s cubic-bezier(.22, 1, .36, 1), background-color .3s;
    }
    a:hover { background: var(--text); transform: translateY(-3px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404<span>.</span></div>
    <h1 id="title">Cette page s'est perdue en route.</h1>
    <p id="text">Le lien est peut-être erroné, ou la page a été déplacée.</p>
    <a id="home" href="/">← Retour à l'accueil</a>
  </main>

  <script>
    (function () {
      // Sur github.io le site vit dans /nom-du-dépôt/ ; sur un domaine propre, à la racine
      var parts = location.pathname.split('/');
      var base = location.hostname.slice(-10) === '.github.io' && parts[1] ? '/' + parts[1] + '/' : '/';
      document.getElementById('home').href = base;

      if ((navigator.language || '').slice(0, 2) === 'en') {
        document.documentElement.lang = 'en';
        document.title = '404 · Page not found';
        document.getElementById('title').textContent = 'This page got lost along the way.';
        document.getElementById('text').textContent = 'The link may be broken, or the page may have moved.';
        document.getElementById('home').textContent = '← Back to the homepage';
      }
    })();
  </script>
</body>
</html>
